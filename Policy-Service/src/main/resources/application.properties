# ----- App -----
spring.application.name=Policy-Service
server.port=8082

# ----- Eureka -----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ----- MySQL -----
spring.datasource.url=jdbc:mysql://localhost:3306/lincoln?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Subrat@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ----- Feign -----
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

server.error.include-message=always
server.error.include-stacktrace=never

# ----- Feign timeouts -----
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=3000

# ----- Resilience4j Circuit Breaker: customerService -----
resilience4j.circuitbreaker.instances.customerService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.customerService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.customerService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.customerService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.customerService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.customerService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Do NOT count "customer not found" as a service failure
resilience4j.circuitbreaker.instances.customerService.ignoreExceptions=feign.FeignException$NotFound

# ----- Resilience4j Retry: customerService -----
resilience4j.retry.instances.customerService.maxAttempts=3
resilience4j.retry.instances.customerService.waitDuration=500ms
resilience4j.retry.instances.customerService.retryExceptions=feign.RetryableException,java.net.ConnectException,feign.FeignException$ServiceUnavailable

# ----- Resilience4j aspect order (Retry outside CircuitBreaker) -----
resilience4j.retry.retryAspectOrder=2
resilience4j.circuitbreaker.circuitBreakerAspectOrder=1

# ----- Kafka -----
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1

# ----- Async -----
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-