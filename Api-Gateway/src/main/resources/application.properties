# ----- App -----
spring.application.name=Api-Gateway
server.port=2222

# ----- Eureka -----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ----- Routes (WebMVC gateway) -----

# Auth Service
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

# Customer Service
spring.cloud.gateway.server.webmvc.routes[1].id=customer-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/customers/**

# Policy Service
spring.cloud.gateway.server.webmvc.routes[2].id=policy-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://POLICY-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/policies/**

# Audit Service
spring.cloud.gateway.server.webmvc.routes[3].id=audit-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://AUDIT-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/audit/**

# ----- Discovery locator off (manual routes only) -----
spring.cloud.gateway.server.webmvc.discovery.locator.enabled=false
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

# ----- Actuator -----
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true

# ----- JWT -----
