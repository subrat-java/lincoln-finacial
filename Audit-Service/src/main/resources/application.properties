# ----- App -----
spring.application.name=Audit-Service
server.port=8085

# ----- Eureka -----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ----- MySQL -----
spring.datasource.url=jdbc:mysql://localhost:3306/lincoln?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Subrat@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ----- Error responses -----
server.error.include-message=always

# ----- Actuator -----
management.endpoints.web.exposure.include=health,info

# ----- Kafka -----
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=audit-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ----- Async -----
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=audit-async-