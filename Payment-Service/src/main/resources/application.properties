# ----- App -----
spring.application.name=Payment-Service
server.port=8084

# ----- Eureka -----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ----- MySQL -----
spring.datasource.url=jdbc:mysql://localhost:3306/lincoln?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Subrat@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ----- Feign timeouts -----
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=3000

# ----- Resilience4j: policyService -----
resilience4j.circuitbreaker.instances.policyService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.policyService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.policyService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.policyService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.policyService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.policyService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.policyService.ignoreExceptions=feign.FeignException$NotFound

resilience4j.retry.instances.policyService.maxAttempts=3
resilience4j.retry.instances.policyService.waitDuration=500ms
resilience4j.retry.instances.policyService.retryExceptions=feign.RetryableException,java.net.ConnectException,feign.FeignException$ServiceUnavailable

resilience4j.retry.retryAspectOrder=2
resilience4j.circuitbreaker.circuitBreakerAspectOrder=1

# ----- Error responses -----
server.error.include-message=always

# ----- Actuator -----
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.circuitbreakers.enabled=true

# Payment Service
spring.cloud.gateway.server.webmvc.routes[4].id=payment-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/payments/**

# ----- Kafka -----
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ----- Async -----
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-